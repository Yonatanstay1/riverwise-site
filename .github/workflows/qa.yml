name: qa
on:
  workflow_dispatch:
    inputs:
      site: { description: 'Site URL', default: 'https://sopavo.com/' }
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node qa/qa.mjs
        env: { SITE: '${{ inputs.site }}' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots }
